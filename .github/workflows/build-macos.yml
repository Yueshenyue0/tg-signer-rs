name: macos
on:
  push:
    tags: ['v*-macos']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-macos-aarch64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cp target/release/tg-signer tg-signer-macos-aarch64
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tg-signer-macos-aarch64
          body: tg-signer macOS ARM (Apple Silicon) 二进制
  build-macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --target x86_64-apple-darwin
      - run: cp target/x86_64-apple-darwin/release/tg-signer tg-signer-macos-x86_64
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tg-signer-macos-x86_64
          body: tg-signer macOS x86_64 (Intel) 二进制