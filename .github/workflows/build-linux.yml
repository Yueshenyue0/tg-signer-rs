name: linux
on:
  push:
    tags: ['v*-linux']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: cp target/x86_64-unknown-linux-musl/release/tg-signer tg-signer-linux-x86_64
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tg-signer-linux-x86_64
          body: tg-signer Linux x86_64 静态二进制（musl，无 glibc 依赖，任意 Linux 可直接运行）
  build-linux-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - run: cross build --release --target aarch64-unknown-linux-musl
      - run: cp target/aarch64-unknown-linux-musl/release/tg-signer tg-signer-linux-aarch64
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tg-signer-linux-aarch64
          body: tg-signer Linux aarch64 静态二进制（musl，无 glibc 依赖，任意 Linux ARM 可直接运行）