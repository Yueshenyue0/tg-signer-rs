name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: cp target/x86_64-unknown-linux-musl/release/tg-signer tg-signer-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: tg-signer-linux-x86_64

  linux-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - run: cross build --release --target aarch64-unknown-linux-musl
      - run: cp target/aarch64-unknown-linux-musl/release/tg-signer tg-signer-linux-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: tg-signer-linux-aarch64

  windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - run: Copy-Item target/release/tg-signer.exe tg-signer-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: tg-signer-windows-x86_64.exe

  macos-aarch64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cp target/release/tg-signer tg-signer-macos-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: tg-signer-macos-aarch64

  macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --target x86_64-apple-darwin
      - run: cp target/x86_64-apple-darwin/release/tg-signer tg-signer-macos-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: tg-signer-macos-x86_64

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-x86_64, linux-aarch64, windows-x86_64, macos-aarch64, macos-x86_64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            tg-signer 全平台无依赖二进制（一次构建，5 平台独立 job）：
            - tg-signer-linux-x86_64   Linux x86_64（musl 静态，无 glibc 依赖）
            - tg-signer-linux-aarch64  Linux ARM（musl 静态）
            - tg-signer-windows-x86_64.exe  Windows（静态 CRT）
            - tg-signer-macos-aarch64  macOS Apple Silicon
            - tg-signer-macos-x86_64   macOS Intel
            多账号：命令末尾加账号编号，如 `tg-signer add @bot /qd 2`