name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Prepare artifact
        run: cp target/release/tg-signer tg-signer-linux-x86_64 && chmod +x tg-signer-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-signer-linux-x86_64
          path: tg-signer-linux-x86_64

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" tg-signer-linux-x86_64 \
            --repo "$GITHUB_REPOSITORY" \
            --title "tg-signer $GITHUB_REF_NAME" \
            --notes "单二进制 tg-signer（Linux x86_64）。用法见 README。"