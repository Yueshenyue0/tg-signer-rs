name: windows
on:
  push:
    tags: ['v*-windows']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - run: Copy-Item target/release/tg-signer.exe tg-signer-windows-x86_64.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tg-signer-windows-x86_64.exe
          body: tg-signer Windows x86_64 静态二进制（静态 CRT，无运行库依赖）